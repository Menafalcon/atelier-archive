<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atelier Archive — the considered second life of clothing</title>
    <meta
      name="description"
      content="Atelier Archive is a peer-to-peer thrift market — half the rail curated and authenticated in studio, half listed by neighbours with their own phone photos and honest measurements."
    />
    <meta name="theme-color" content="#F2EBDD" />
    <meta name="color-scheme" content="light" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171410'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='34' fill='%23F2EBDD' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />

    <!--
      Type is vendored in assets/fonts (latin subsets, OFL): Bodoni Moda for display,
      Manrope for the interface, IBM Plex Mono for labels and figures. No network
      request is made at runtime, so the archive renders identically offline.
    -->
    <link rel="stylesheet" href="assets/css/fonts.css" />

    <script src="assets/vendor/tailwind.js"></script>

            },

              paper: '#FBF6EB',
              oxblood: '#5E1B22',
              vermilion: '#C0442B',
              brass: '#A98A55',
              moss: '#33452F',
              clay: {

                100: '#EFD9D5',

                500: '#934338',
                600: '#76302A',
                700: '#5E1B22',
                800: '#4A151B',
                900: '#380F14',
              },

                300: '#D5B36C',

              stamp: '4px 4px 0 0 #171410',
            },
            letterSpacing: {
              widest2: '0.3em',
            },
            borderRadius: {
              sharp: '2px',
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="assets/css/app.css" />
  </head>

  <body class="min-h-screen bg-bone font-sans text-ink antialiased">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[200] focus:bg-ink focus:px-5 focus:py-3 focus:font-mono focus:text-[10px] focus:uppercase focus:tracking-[0.18em] focus:text-bone"
      >Skip to content</a
    >

    <div id="header-root" class="contents"></div>

    <main id="main" class="min-h-[62vh]"></main>

    <div id="footer-root"></div>

    <!-- overlay surfaces (each isolated so animations do not replay) -->
    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div id="search-root"></div>
    <div id="chat-root-host"></div>

    <noscript>
      <div class="mx-auto max-w-lg px-6 py-24 text-center">
        <h1 class="font-display text-3xl">Atelier Archive</h1>
        <p class="mt-3 text-sm text-stone-500">This boutique needs JavaScript enabled to browse the floor.</p>
      </div>
    </noscript>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
